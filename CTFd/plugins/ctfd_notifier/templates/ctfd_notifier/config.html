{% extends "admin/base.html" %}

{% block content %}
<div class="jumbotron">
	<div class="container">
		<h1>Notifier</h1>
		<p class="mb-0">Announce challenge solves to a Discord channel via webhook.</p>
	</div>
</div>
<div class="container">
	<div class="row">
		<div class="col-md-9 offset-md-1">
			{% for error in errors %}
				<div class="alert alert-danger alert-dismissable" role="alert">
					<span class="sr-only">Error:</span>
					{{ error }}
					<button type="button" class="close" data-dismiss="alert" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
			{% endfor %}
			{% if success %}
				<div class="alert alert-success alert-dismissable" role="alert">
					{{ success }}
					<button type="button" class="close" data-dismiss="alert" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
			{% endif %}

			{% include "ctfd_notifier/configs/discord.html" %}
		</div>
	</div>
</div>
{% endblock %}
